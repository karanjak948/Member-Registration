<svg width="210" height="42" viewBox="0 0 210 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Royal SACCO Emblem / Shield & Crown Icon -->
  <g transform="translate(2, 3)">
    <!-- Outer Shield Gradient -->
    <defs>
      <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#1e3a8a" />
      </linearGradient>
      <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>
    </defs>
    
    <!-- Shield Base -->
    <path d="M18 1C9 1 2 6 2 15C2 26 18 35 18 35C18 35 34 26 34 15C34 6 27 1 18 1Z" fill="url(#shieldGrad)" />
    
    <!-- Inner Emblem: Crown & Dynamic Growth Arc -->
    <!-- Crown -->
    <path d="M11 19L14 13L18 17L22 13L25 19H11Z" fill="url(#crownGrad)" />
    <circle cx="11" cy="11.5" r="1.5" fill="#fbbf24" />
    <circle cx="18" cy="9.5" r="1.5" fill="#fbbf24" />
    <circle cx="25" cy="11.5" r="1.5" fill="#fbbf24" />
    
    <!-- Growth Arc / Sacco Coin Base -->
    <path d="M10 23C12.5 25.5 15.2 26.5 18 26.5C20.8 26.5 23.5 25.5 26 23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="48" y="21" font-family="'Arimo', 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#1e293b" letter-spacing="1">ROYAL <tspan fill="#0d9488">SACCO</tspan></text>
  <text x="49" y="33" font-family="'Arimo', 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#64748b" letter-spacing="1.2">MEMBER &amp; LOAN SYSTEM</text>
</svg>
