version: "3.9"

services:
  # Database Service (MySQL / MariaDB matching settings.py)
  db:
    image: mysql:8.0
    container_name: royal_sacco_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-member_registration_db}
      MYSQL_USER: ${DB_USER:-sacco_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SaccoPass@2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPass@2026}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Django Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: royal_sacco_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_members &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-secret-key-change-in-env}
      - DB_NAME=${DB_NAME:-member_registration_db}
      - DB_USER=${DB_USER:-sacco_user}
      - DB_PASSWORD=${DB_PASSWORD:-SaccoPass@2026}
      - DB_HOST=db
      - DB_PORT=3306
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,v1.royalltd.co.ke
      - CORS_ALLOW_ALL_ORIGINS=True
    volumes:
      - backend_media:/app/media
      - backend_static:/app/static
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend/package
      dockerfile: Dockerfile
    container_name: royal_sacco_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://v1.royalltd.co.ke
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-ffc7161deb1d093c465d4eef25722da8ae4f474b45f4b2f5bf15c023d5ff233c}
      - DJANGO_API_URL=http://backend:8000/api
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_LOAN_API_URL=https://v1.royalltd.co.ke/lne/api
    depends_on:
      - backend
    networks:
      - app_network

  # Nginx Gateway Service (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: royal_sacco_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_media:/var/www/media:ro
      - backend_static:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  db_data:
  backend_media:
  backend_static:

networks:
  app_network:
    driver: bridge
